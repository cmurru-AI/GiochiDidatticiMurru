<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Fractions Quest</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Trebuchet MS',sans-serif;
}

body{
background:
linear-gradient(
135deg,
#1e3c72,
#2a5298);
min-height:100vh;
display:flex;
flex-direction:column;
gap:12px;
padding:16px 0;
justify-content:center;
align-items:center;
color:white;
}

.game{

width:900px;
max-width:95%;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(12px);
border-radius:25px;
padding:30px;
box-shadow:0 0 30px rgba(0,0,0,.5);

}

h1{
text-align:center;
margin-bottom:20px;
text-shadow:0 0 15px gold;
}

.topbar{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
margin-bottom:20px;
font-size:20px;
}

#timer{
font-size:26px;
color:#ffd700;
}

.progress{

height:20px;
background:#333;
border-radius:20px;
overflow:hidden;
margin:20px 0;
}

.progress-bar{

height:100%;
width:0;
background:linear-gradient(
90deg,
lime,
gold);
transition:.4s;
}

.map{
display:flex;
justify-content:space-between;
margin:25px 0;
}

.world{

width:70px;
height:70px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
background:#444;
border:3px solid white;
transition:.5s;

}

.active{
transform:scale(1.2);
background:gold;
color:black;
box-shadow:0 0 20px gold;
}

.question{

font-size:25px;
text-align:center;
margin:25px;
}

.answers button{

width:100%;
margin:10px 0;
padding:15px;
font-size:20px;
border:none;
border-radius:15px;
cursor:pointer;
background:#2196f3;
color:white;
transition:.3s;
}

.answers button:hover{
transform:scale(1.03);
background:#42a5f5;
}

#message{
text-align:center;
font-size:24px;
margin-top:15px;
}

.badges{
margin-top:20px;
}

.badge{
display:inline-block;
padding:8px 15px;
border-radius:20px;
background:gold;
color:black;
margin:5px;
font-weight:bold;
}

.hidden{
display:none;
}

.final{
text-align:center;
font-size:28px;
}

.home-link{display:inline-block;align-self:flex-start;padding:8px 14px;border-radius:999px;border:2px solid white;background:transparent;color:white;font-weight:700;font-size:15px;text-decoration:none}
.home-link:focus-visible{outline:4px solid gold;outline-offset:3px}
</style>
</head>

<body>

<a class="home-link" href="../../">← Officina Didattica</a>

<div class="game">

<h1>🏴‍☠️ Fantasy Fractions Quest</h1>

<div class="topbar">

<div>⭐ Punti: <span id="score">0</span></div>

<div>❤️ <span id="lives">3</span></div>

<div>⏱️ <span id="timer">20</span></div>

</div>

<div class="progress">
<div class="progress-bar" id="exp"></div>
</div>

<div class="map">

<div class="world active">🌳</div>
<div class="world">🌉</div>
<div class="world">🌊</div>
<div class="world">🔥</div>
<div class="world">👑</div>

</div>

<div id="question" class="question"></div>

<div id="answers" class="answers"></div>

<div id="message"></div>

<div class="badges">
<h3>🏆 Badge Ottenuti</h3>
<div id="badgeContainer"></div>
</div>

</div>

<script>

let audio = new AudioContext();

function beep(freq,duration){

let osc = audio.createOscillator();
let gain = audio.createGain();

osc.connect(gain);
gain.connect(audio.destination);

osc.frequency.value=freq;

osc.start();

gain.gain.setValueAtTime(0.2,audio.currentTime);
gain.gain.exponentialRampToValueAtTime(
0.001,
audio.currentTime+duration);

osc.stop(audio.currentTime+duration);

}

const questions=[

{
level:0,
q:"Quale frazione è equivalente a 3/4 ?",
a:["6/8","6/10","9/16"],
c:0
},

{
level:0,
q:"Quale frazione è equivalente a 2/5 ?",
a:["4/10","6/10","8/15"],
c:0
},

{
level:1,
q:"Semplifica 18/24",
a:["3/4","6/8","2/3"],
c:0
},

{
level:1,
q:"Semplifica 15/45",
a:["1/5","1/3","3/5"],
c:1
},

{
level:2,
q:"1/3 + 1/6 = ?",
a:["2/9","1/2","3/6"],
c:1
},

{
level:2,
q:"5/8 - 1/4 = ?",
a:["3/8","4/8","2/8"],
c:0
},

{
level:3,
q:"Una pizza ha 8 fette. Ne mangi 3. Quanto resta?",
a:["5/8","3/8","1/2"],
c:0
},

{
level:3,
q:"1/3 di 24 studenti = ?",
a:["6","8","12"],
c:1
},

{
level:4,
q:"BOSS: 2/5 + 1/10 = ?",
a:["1/2","3/10","7/10"],
c:0
},

{
level:4,
q:"BOSS: 3/4 di 20 = ?",
a:["10","15","18"],
c:1
}

];

let current=0;
let score=0;
let lives=3;
let timer=20;
let interval;

const worlds=document.querySelectorAll(".world");

function badge(nome){

let b=document.createElement("span");
b.className="badge";
b.innerHTML=nome;
document.getElementById("badgeContainer")
.appendChild(b);

}

function loadQuestion(){

clearInterval(interval);

if(current>=questions.length){
victory();
return;
}

const q=questions[current];

worlds.forEach(w=>w.classList.remove("active"));
worlds[q.level].classList.add("active");

document.getElementById("question")
.innerHTML=q.q;

let html="";

q.a.forEach((ans,i)=>{

html+=`
<button onclick="answer(${i})">
${ans}
</button>
`;

});

document.getElementById("answers")
.innerHTML=html;

timer=20;
document.getElementById("timer")
.textContent=timer;

interval=setInterval(()=>{

timer--;

document.getElementById("timer")
.textContent=timer;

if(timer<=0){

clearInterval(interval);

wrong();

}

},1000);

updateExp();

}

function answer(choice){

let q=questions[current];

if(choice===q.c){

beep(800,.2);

score+=10;

if(score===20) badge("🌳 Esperto Equivalenze");
if(score===40) badge("🌉 Re delle Semplificazioni");
if(score===60) badge("🌊 Mago delle Operazioni");
if(score===80) badge("🔥 Maestro dei Problemi");

document.getElementById("score")
.textContent=score;

document.getElementById("message")
.innerHTML="✅ Corretto!";

current++;

setTimeout(loadQuestion,700);

}
else{

wrong();

}

}

function wrong(){

beep(200,.4);

lives--;

document.getElementById("lives")
.textContent=lives;

document.getElementById("message")
.innerHTML="❌ Attenzione!";

if(lives<=0){

gameOver();
return;

}

current++;

setTimeout(loadQuestion,1000);

}

function updateExp(){

let perc=
(current/questions.length)*100;

document.getElementById("exp")
.style.width=perc+"%";

}

function gameOver(){

clearInterval(interval);

document.querySelector(".game").innerHTML=`

<div class="final">

<h1>💀 Game Over</h1>

<p>Punteggio: ${score}</p>

<button onclick="location.reload()">

Ricomincia

</button>

</div>

`;

}

function victory(){

clearInterval(interval);

badge("👑 Campione delle Frazioni");

document.querySelector(".game").innerHTML=`

<div class="final">

<h1>🎉 TESORO TROVATO!</h1>

<h2>Punteggio Finale: ${score}</h2>

<h2>🏆 Maestro delle Frazioni</h2>

<br>

<button onclick="location.reload()">

Gioca Ancora

</button>

</div>

`;

beep(900,.2);

setTimeout(()=>beep(1200,.2),300);

setTimeout(()=>beep(1500,.3),600);

}

loadQuestion();

</script>

</body>
</html>
